aid: thorin
name: Thorin
description: Thorin is an applied-AI startup incubated and backed by 8VC (Joe Lonsdale),
  building a workbench for company agents. Its product at app.thorin.com pairs a personal
  agent that acts as your delegate with project agents that own shared team workflows,
  connecting business systems (Slack, Google Workspace, Notion, Gong, Salesforce, Affinity,
  and MCP) and organizing company context into feeds that power reusable skills and
  scheduled automations. Thorin observes work across email, chat, meetings, and documents
  to build a real-time model of how a business operates, then automates recurring
  processes such as deal flow, deal-prep briefs, and inbox switchboards. Seed-stage,
  based in San Francisco. This profile documents Thorin's product and documentation
  surface; no public developer API is published as of this enrichment pass.
